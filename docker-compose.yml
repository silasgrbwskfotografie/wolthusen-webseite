# Protokolle der Container begrenzen (sonst wächst die Festplatte über Monate voll)
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  hub:
    build: .
    image: wolthusen-hub:latest
    container_name: wolthusen-hub
    restart: unless-stopped
    env_file: .env
    environment:
      TMH_SECURE_COOKIES: "1"
      TMH_TRUST_PROXY: "1"
      # Öffentliche Adresse für Links (Mails, Instagram-Bilder): kommt aus DOMAIN in der .env, nur dort ändern
      SITE_URL: "https://${DOMAIN}"
    volumes:
      - ./data:/data
    expose:
      - "8765"
    networks: [web]
    logging: *logging

  caddy:
    image: caddy:2
    container_name: wolthusen-caddy
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - hub
    networks: [web]
    logging: *logging

networks:
  web:

volumes:
  caddy_data:
  caddy_config:
